# İddaa oranlarını (tüm takip edilen ligler) 3 saatte bir toplar; değişen oranlar data/raw/iddaa/'ya yazılır.
# Ardından risk seviyeli tavsiye raporunu üretir: tavsiyeler/son.md (GitHub'da okunur) + günün arşivi.
name: İddaa oranları

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Telegram'a test mesajı gönder"
        type: boolean
        default: false
      telegram_ozet:
        description: "Telegram'a güncel özeti şimdi gönder (bugün zaten gittiyse de)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veri-guncelle   # veri işiyle aynı sırada: ikisi aynı anda push etmesin

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılık
        run: pip install -r requirements.txt

      - name: Veritabanı (takım adı eşleştirme için)
        run: python main.py build

      - name: Oranları topla
        run: python main.py iddaa

      - name: Tavsiye raporu (tavsiyeler/son.md)
        run: python main.py tavsiye --yayinla --fixtures data/raw/fixtures.csv

      - name: Telegram test mesajı (elle, isteğe bağlı)
        if: ${{ inputs.telegram_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py telegram --test

      - name: Telegram bildirimi
        continue-on-error: true   # bildirim hatası veri kaydını engellemesin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py telegram ${{ inputs.telegram_ozet && '--ozet' || '' }}

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/iddaa tavsiyeler 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Yeni oran yok."
            exit 0
          fi
          git commit -m "İddaa oranları $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

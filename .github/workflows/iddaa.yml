# İddaa oranlarını (La Liga + La Liga 2) 3 saatte bir toplar; değişen oranlar data/raw/iddaa/'ya yazılır.
# Oran geçmişi, İddaa fiyatlarının keskin kapanışa göre değerini (CLV) ölçmek için kullanılır.
name: İddaa oranları

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri-guncelle   # veri işiyle aynı sırada: ikisi aynı anda push etmesin

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılık
        run: pip install -r requirements.txt

      - name: Veritabanı (takım adı eşleştirme için)
        run: python main.py build

      - name: Oranları topla
        run: python main.py iddaa

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/iddaa 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Yeni oran yok."
            exit 0
          fi
          git commit -m "İddaa oranları $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
